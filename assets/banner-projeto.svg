<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="Construindo agora: marketplace imobiliário · web + mobile + API">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#0f1f2e" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0" />
      <stop offset="0.5" stop-color="#3fb950" />
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="halo" cx="0.85" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="card"><rect width="840" height="150" rx="16" /></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .sweep { animation: sweep 4.5s ease-in-out infinite; }
    .flow { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
    .live { animation: live 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { 0% { transform: translateX(-320px); } 100% { transform: translateX(840px); } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="150" fill="url(#bg)" />
    <rect width="840" height="150" fill="url(#halo)" />
    <rect class="sweep" y="147" width="320" height="3" fill="url(#glow)" />
  </g>
  <rect x="0.5" y="0.5" width="839" height="149" rx="15.5" fill="none" stroke="#30363d" />

  <circle class="live" cx="46" cy="41" r="4.5" fill="#3fb950" />
  <text x="60" y="46" class="mono" font-size="14" fill="#3fb950">construindo agora<tspan class="cursor"> _</tspan></text>
  <text x="40" y="92" class="sans" font-size="34" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">Marketplace imobiliário</text>
  <text x="40" y="122" class="sans" font-size="16" fill="#8b949e">web  +  mobile  +  API  ·  um monorepo, ponta a ponta</text>

  <g class="mono" font-size="12" text-anchor="middle">
    <path class="flow" d="M628 52 L700 75 M628 98 L700 75 M760 75 L790 75" stroke="#58a6ff" stroke-opacity="0.7" stroke-width="1.5" fill="none" />
    <rect x="578" y="38" width="50" height="28" rx="7" fill="#161b22" stroke="#30363d" />
    <text x="603" y="56" fill="#c9d1d9">web</text>
    <rect x="578" y="84" width="50" height="28" rx="7" fill="#161b22" stroke="#30363d" />
    <text x="603" y="102" fill="#c9d1d9">app</text>
    <rect x="700" y="61" width="60" height="28" rx="7" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.6" />
    <text x="730" y="79" fill="#58a6ff">API</text>
    <circle cx="800" cy="75" r="10" fill="#161b22" stroke="#3fb950" stroke-opacity="0.7" />
    <path d="M795 72 h10 M795 75 h10 M795 78 h10" stroke="#3fb950" stroke-opacity="0.8" stroke-width="1.2" />
  </g>
</svg>
