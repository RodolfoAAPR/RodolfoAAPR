<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="316" viewBox="0 0 840 316" role="img" aria-label="Construindo agora: marketplace imobiliário, web + mobile + API. Monorepo Turborepo + pnpm; API type-safe com Hono + Zod; Postgres com RLS e auditoria; E2E de web e mobile no CI; web no Cloud Run + app iOS/Android com updates OTA; IA: subagents em paralelo, revisão de código e entregas mais rápidas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#0f1f2e" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0" />
      <stop offset="0.5" stop-color="#3fb950" />
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="halo" cx="0.9" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="card"><rect width="840" height="316" rx="16" /></clipPath>
    <g id="tick">
      <rect width="18" height="18" rx="5" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.5" />
      <path d="M5 9.5 l3 3 l5.5 -6.5" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .sweep { animation: sweep 4.5s ease-in-out infinite; }
    .live { animation: live 2s ease-in-out infinite; }
    .in { animation: in 0.6s ease-out both; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.25s; } .d3 { animation-delay: 0.4s; }
    .d4 { animation-delay: 0.55s; } .d5 { animation-delay: 0.7s; } .d6 { animation-delay: 0.85s; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { 0% { transform: translateX(-320px); } 100% { transform: translateX(840px); } }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="316" fill="url(#bg)" />
    <rect width="840" height="316" fill="url(#halo)" />
    <rect class="sweep" y="313" width="320" height="3" fill="url(#glow)" />
  </g>
  <rect x="0.5" y="0.5" width="839" height="315" rx="15.5" fill="none" stroke="#30363d" />

  <circle class="live" cx="46" cy="41" r="4.5" fill="#3fb950" />
  <text x="60" y="46" class="mono" font-size="14" fill="#3fb950">construindo agora<tspan class="cursor"> _</tspan></text>
  <text x="40" y="92" class="sans" font-size="34" font-weight="700" fill="#e6edf3" letter-spacing="-0.5">Marketplace imobiliário</text>
  <text x="40" y="122" class="sans" font-size="16" fill="#8b949e">web  +  mobile  +  API  ·  um monorepo, ponta a ponta</text>
  <rect x="40" y="146" width="760" height="1" fill="#30363d" />

  <g class="sans" font-size="15" fill="#c9d1d9">
    <g class="in d1"><use href="#tick" xlink:href="#tick" x="40" y="166" /><text x="68" y="180">Monorepo Turborepo + pnpm</text></g>
    <g class="in d2"><use href="#tick" xlink:href="#tick" x="430" y="166" /><text x="458" y="180">API type-safe com Hono + Zod</text></g>
    <g class="in d3"><use href="#tick" xlink:href="#tick" x="40" y="200" /><text x="68" y="214">Postgres com RLS e auditoria</text></g>
    <g class="in d4"><use href="#tick" xlink:href="#tick" x="430" y="200" /><text x="458" y="214">E2E de web e mobile no CI</text></g>
    <g class="in d5"><use href="#tick" xlink:href="#tick" x="40" y="234" /><text x="68" y="248">Web no Cloud Run + app iOS/Android com updates OTA</text></g>
    <g class="in d6"><use href="#tick" xlink:href="#tick" x="40" y="268" /><text x="68" y="282"><tspan fill="#a371f7" font-weight="600">IA:</tspan> subagents em paralelo, revisão de código e entregas mais rápidas</text></g>
  </g>
</svg>
