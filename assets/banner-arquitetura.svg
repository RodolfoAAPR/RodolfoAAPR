<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330" role="img" aria-label="Arquitetura: web em Next.js e app mobile em Expo falam com uma API em Hono + Zod; a API usa Postgres no Supabase com RLS e RPCs, e IA com Claude e OpenAI. Na entrega, o GitHub Actions publica a web no Cloud Run e o app nas lojas via EAS.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#14132a" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#58a6ff" />
      <stop offset="1" stop-color="#a371f7" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#8b949e" stroke-opacity="0.07" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff" fill-opacity="0.8" />
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950" fill-opacity="0.8" />
    </marker>
    <clipPath id="card"><rect width="840" height="330" rx="16" /></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .sweep { animation: sweep 4.5s ease-in-out infinite; }
    .flow { stroke-dasharray: 5 6; animation: flow 1.2s linear infinite; }
    .core { animation: core 3s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { 0% { transform: translateX(-320px); } 100% { transform: translateX(840px); } }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @keyframes core { 0%, 100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    .box { fill: #161b22; stroke: #30363d; }
    .title { font-size: 15px; font-weight: 600; fill: #e6edf3; }
    .sub { font-size: 12px; fill: #8b949e; }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="330" fill="url(#bg)" />
    <rect width="840" height="330" fill="url(#grid)" />
    <rect class="sweep" y="327" width="320" height="3" fill="url(#glow)" />
  </g>
  <rect x="0.5" y="0.5" width="839" height="329" rx="15.5" fill="none" stroke="#30363d" />

  <text x="40" y="46" class="mono" font-size="14" fill="#58a6ff">// arquitetura<tspan class="cursor"> _</tspan></text>

  <!-- runtime -->
  <g fill="none" stroke="#58a6ff" stroke-opacity="0.75" stroke-width="1.5" marker-end="url(#arrow)">
    <path class="flow" d="M230 95 C 275 95, 275 125, 318 125" />
    <path class="flow" d="M230 165 C 275 165, 275 135, 318 135" />
    <path class="flow" d="M522 125 C 565 125, 565 95, 608 95" />
    <path class="flow" d="M522 135 C 565 135, 565 165, 608 165" />
  </g>

  <g class="sans">
    <rect class="box" x="40" y="72" width="190" height="46" rx="10" />
    <text class="title" x="58" y="92">Web</text><text class="sub" x="58" y="109">Next.js · React</text>

    <rect class="box" x="40" y="142" width="190" height="46" rx="10" />
    <text class="title" x="58" y="162">Mobile</text><text class="sub" x="58" y="179">Expo · React Native</text>

    <rect class="box core" x="320" y="104" width="200" height="52" rx="10" stroke="#58a6ff" />
    <text class="title" x="338" y="127">API</text><text class="sub" x="338" y="145">Hono + Zod · type-safe</text>

    <rect class="box" x="610" y="72" width="190" height="46" rx="10" />
    <text class="title" x="628" y="92">Postgres</text><text class="sub" x="628" y="109">Supabase · RLS + RPCs</text>

    <rect class="box" x="610" y="142" width="190" height="46" rx="10" />
    <text class="title" x="628" y="162">IA</text><text class="sub" x="628" y="179">Claude · OpenAI</text>
  </g>

  <!-- entrega -->
  <rect x="40" y="214" width="760" height="1" fill="#30363d" />
  <text x="40" y="240" class="mono" font-size="12" fill="#3fb950">// entrega</text>

  <g fill="none" stroke="#3fb950" stroke-opacity="0.75" stroke-width="1.5" marker-end="url(#arrowG)">
    <path class="flow" d="M320 280 H 232" />
    <path class="flow" d="M520 280 H 608" />
  </g>

  <g class="sans">
    <rect class="box" x="40" y="257" width="190" height="46" rx="10" />
    <text class="title" x="58" y="277">Cloud Run</text><text class="sub" x="58" y="294">web em produção</text>

    <rect class="box" x="320" y="257" width="200" height="46" rx="10" stroke="#3fb950" stroke-opacity="0.6" />
    <text class="title" x="338" y="277">GitHub Actions</text><text class="sub" x="338" y="294">CI · testes · deploy</text>

    <rect class="box" x="610" y="257" width="190" height="46" rx="10" />
    <text class="title" x="628" y="277">EAS</text><text class="sub" x="628" y="294">lojas + updates OTA</text>
  </g>
</svg>
